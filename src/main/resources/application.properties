spring.application.name=byeolmyeong-api

# 로컬에서는 .env 를 읽는다(없으면 건너뛴다). 값은 환경 변수로만 준다. 이름은 .env.example
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# 로그인 없는 엔드포인트의 주소(IP)별 분당 요청 수 한도. 서버 메모리에서 센다.
byeolmyeong.rate-limit.charts-per-minute=30
byeolmyeong.rate-limit.places-per-minute=120
# 자주 묻는 질문(GET /faqs). 세션 없이 읽는다.
byeolmyeong.rate-limit.faqs-per-minute=120
# 앱 설정(GET /app-config). 세션 없이 읽는다. 앱이 시작할 때와 426 을 받았을 때 부른다.
byeolmyeong.rate-limit.app-config-per-minute=120
# 직접 입력 궁합(POST /synastry/direct). 요청마다 모델 호출이 나간다.
byeolmyeong.rate-limit.synastry-per-minute=10
# 문의하기(POST /inquiries). 이것만 계정별·시간당이다(결정 013). 검증을 통과한 문의만 센다.
byeolmyeong.rate-limit.inquiries-per-hour=5

# 관리자 로그인 시도(POST /admin/auth/login). 10분에 주소(IP)별·아이디별로 이만큼까지(결정 014). 성공한 로그인도 센다.
byeolmyeong.rate-limit.admin-login-per-ip=20
byeolmyeong.rate-limit.admin-login-per-id=5

# 공유 카드 공개 조회(GET /shared/{shareId}). 식별자를 마구 넣어 보는 것을 늦춘다.
byeolmyeong.rate-limit.shared-per-minute=120
# 로그인 · 가입(POST /auth/login · /auth/signup)을 합친 주소(IP)별 분당 한도(결정 021). 카카오 웹 코드는 확인 전에 카카오를 부른다.
byeolmyeong.rate-limit.auth-per-minute=30

# 웹 앱이 열리는 주소(브라우저의 다른 출처 요청 허용). 쉼표로 구분. 비어 있으면 아무 주소도 허용하지 않는다.
byeolmyeong.cors.allowed-origins=${ALLOWED_ORIGINS:}
# 관리 화면(웹)이 열리는 주소. 쉼표로 구분. /admin/** 는 이 주소만 허용한다(앱의 주소는 /admin/** 를 부를 수 없고, 이 주소는 나머지 경로를 부를 수 없다).
byeolmyeong.cors.admin-allowed-origins=${ADMIN_ALLOWED_ORIGINS:}

# 앱 설정(최소 버전·강제 업데이트, 결정 016)을 서버 메모리에 두는 시간(초). 모든 요청이 확인하므로 요청마다 DB 를 읽지 않게 한다.
# 관리자가 고치면 그 서버의 캐시는 바로 비워지고, 다른 서버는 이 시간 안에 따라온다. 0 이면 캐시하지 않는다.
byeolmyeong.app-config.cache-seconds=5

# 개발용 로그인(POST /auth/dev). 운영에서는 켜지 않는다. 켜면 누구나 같은 개발용 계정으로 들어온다(결정 005).
byeolmyeong.auth.dev-enabled=${AUTH_DEV_ENABLED:false}
# 세션은 마지막 사용 후 이만큼(일) 지나면 끝난다(결정 021). 마지막 사용 시각은 하루에 한 번만 고쳐 쓴다.
byeolmyeong.auth.session-days=90
# 웹 세션 쿠키 bm_session 의 Secure(결정 021). 로컬 http 개발에서만 false.
byeolmyeong.auth.cookie-secure=${SESSION_COOKIE_SECURE:true}
# 공급자 ID 토큰의 대상(aud) 목록(결정 021). 비어 있으면 그 공급자의 로그인은 모두 401 이다.
byeolmyeong.auth.google.client-ids=${GOOGLE_CLIENT_IDS:}
byeolmyeong.auth.apple.client-ids=${APPLE_CLIENT_IDS:}
# 카카오는 REST API 키(웹 — 서버가 인가 코드를 교환)와 네이티브 앱 키(앱 SDK) 둘 다 대상이다.
byeolmyeong.auth.kakao.client-ids=${KAKAO_REST_API_KEY:},${KAKAO_NATIVE_APP_KEY:}
# 카카오 웹 로그인의 인가 코드 교환(결정 021). 돌아올 주소는 카카오 콘솔에 등록한 것과 같아야 하고, 목록에 없으면 401 INVALID_CODE.
byeolmyeong.auth.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
byeolmyeong.auth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
byeolmyeong.auth.kakao.redirect-uris=${KAKAO_REDIRECT_URIS:}
byeolmyeong.auth.kakao.auth-url=https://kauth.kakao.com
# 탈퇴 때 카카오 연결 끊기(결정 021, 카카오 문서상 필수). 어드민 키가 없으면 부르지 않는다(계정은 지운다).
byeolmyeong.auth.kakao.admin-key=${KAKAO_ADMIN_KEY:}
byeolmyeong.auth.kakao.api-url=https://kapi.kakao.com
# 애플 토큰 교환 · 철회(탈퇴 때)와 서버 알림(결정 021). 키가 없으면 애플을 부르지 않는다(로그인은 된다).
byeolmyeong.auth.apple.team-id=${APPLE_TEAM_ID:}
byeolmyeong.auth.apple.key-id=${APPLE_KEY_ID:}
byeolmyeong.auth.apple.private-key=${APPLE_PRIVATE_KEY:}
byeolmyeong.auth.apple.auth-url=https://appleid.apple.com

# 관리자 API(/admin/**, 결정 014). 앱 사용자의 로그인과 완전히 따로다.
# 첫 관리자: 관리자가 한 명도 없고 두 값이 다 있을 때만 서버가 뜨면서 만든다. 관리자가 있으면 읽지 않는다. 없으면 관리자 API 는 전부 닫혀 있다.
byeolmyeong.admin.bootstrap-id=${ADMIN_BOOTSTRAP_ID:}
byeolmyeong.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
# 관리자 세션은 로그인한 때부터 이 시간 뒤에 끝난다(쓰는 동안 늘어나지 않는다).
byeolmyeong.admin.session-hours=12
# bcrypt 강도(4~31). 1 올리면 로그인 한 번의 계산이 두 배가 된다.
byeolmyeong.admin.bcrypt-strength=12

# 글 생성(Claude API, 결정 006). 키는 환경 변수로만 준다. 비어 있어도 서버는 뜨고, 생성 요청만 502 가 된다.
byeolmyeong.claude.api-key=${ANTHROPIC_API_KEY:}
byeolmyeong.claude.base-url=https://api.anthropic.com
byeolmyeong.claude.model=${CLAUDE_MODEL:claude-opus-5-5}
# 생각의 깊이(low · medium · high · xhigh · max). 깊을수록 느리고 비싸다.
byeolmyeong.claude.effort=medium
# 한 번의 생성 호출을 기다리는 시간(초). 넘으면 실패로 본다.
byeolmyeong.claude.timeout-seconds=120
# 모델이 안전 분류기에 걸려 거절하면 Anthropic 이 권하는 다른 모델로 서버 쪽에서 다시 돌린다.
byeolmyeong.claude.refusal-fallback=true

# 심층 리포트의 글을 뒤에서 쓰는 일꾼. 일 하나 = 한 영역의 모델 호출이라, 스레드 수가 동시에 나가는 모델 호출 수의 상한이다.
# 스레드 5 = 리포트 한 편의 네 영역과 시기를 한꺼번에. 줄 40 = 리포트 8편이 기다릴 수 있고, 차면 그 요청은 FAILED 가 된다.
byeolmyeong.report.worker-threads=5
byeolmyeong.report.queue-capacity=40
# 이 서버가 맡은 리포트(줄에서 기다리는 것 포함)가 살아 있다고 행에 적는 주기(초). 이 표시가 2분 넘게 끊긴 WRITING 은 멈춘 것으로 본다.
byeolmyeong.report.heartbeat-seconds=15
