spring.application.name=byeolmyeong-api

# 로컬에서는 .env 를 읽는다(없으면 건너뛴다). 값은 환경 변수로만 준다. 이름은 .env.example
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# 로그인 없는 엔드포인트의 주소(IP)별 분당 요청 수 한도. 서버 메모리에서 센다.
byeolmyeong.rate-limit.charts-per-minute=30
byeolmyeong.rate-limit.places-per-minute=120

# 웹 앱이 열리는 주소(브라우저의 다른 출처 요청 허용). 쉼표로 구분. 비어 있으면 아무 주소도 허용하지 않는다.
byeolmyeong.cors.allowed-origins=${ALLOWED_ORIGINS:}

# 개발용 로그인(POST /auth/dev). 운영에서는 켜지 않는다. 켜면 누구나 같은 개발용 계정으로 들어온다(결정 005).
byeolmyeong.auth.dev-enabled=${AUTH_DEV_ENABLED:false}

# 글 생성(Claude API, 결정 006). 키는 환경 변수로만 준다. 비어 있어도 서버는 뜨고, 생성 요청만 502 가 된다.
byeolmyeong.claude.api-key=${ANTHROPIC_API_KEY:}
byeolmyeong.claude.base-url=https://api.anthropic.com
byeolmyeong.claude.model=${CLAUDE_MODEL:claude-opus-5-5}
# 생각의 깊이(low · medium · high · xhigh · max). 깊을수록 느리고 비싸다.
byeolmyeong.claude.effort=medium
# 한 번의 생성 호출을 기다리는 시간(초). 넘으면 실패로 본다.
byeolmyeong.claude.timeout-seconds=120
# 모델이 안전 분류기에 걸려 거절하면 Anthropic 이 권하는 다른 모델로 서버 쪽에서 다시 돌린다.
byeolmyeong.claude.refusal-fallback=true
