# 테스트에만 더하는 설정(본 application.properties 위에 얹힌다). 통합 테스트는 로컬 환경으로 본다.
# 개발용 로그인을 켜는 테스트(DEV_AUTH_ON)가 결정 022 의 안전장치에 걸리지 않게 한다. 안전장치 자체는 DevLoginGuardTest 가 본다.
byeolmyeong.deploy-env=local
# 통합 테스트는 모두 같은 개발용 계정을 쓰므로 생성 경로의 계정별 한도(결정 022)를 크게 둔다. 한도 자체는 GenerationQuotaTest·GenerationQuotaIntegrationTest 가 본다.
byeolmyeong.rate-limit.generation-per-minute=100000
byeolmyeong.rate-limit.generation-per-hour=100000
# 궁합의 하루 안전 한도(결정 053 의 6)도 같은 까닭으로 크게 둔다. 한도 자체는 SynastryDailyLimitIntegrationTest 가 본다.
byeolmyeong.synastry.daily-limit=100000
# 1.0.0 수령자 채우기의 매시 일정(결정 056 의 6)을 끈다 — 테스트 DB 의 행 시각은 실제 시각이라 가짜 시계와 섞이지 않게. 채우기 자체는 메서드를 직접 불러 본다.
byeolmyeong.purchase.legacy-backfill-cron=-
