# 배포(결정 020). 절차·되돌리기는 docs/deploy.md.
# - main 에 합쳐지고 ci 가 통과하면 → 스테이징(그 커밋, bootJar 만)
# - v* 태그를 달면 → 운영(그 커밋으로 빌드·테스트를 다시 돌린 뒤, 바꾸기 전에 DB 백업)
# - 수동 실행(대상·ref) → 되돌리기나 다시 올리기
# 저장소 변수 DEPLOY_ENABLED 가 true 일 때만 돈다. "배포 전 확인" 계획(docs/plans/2026-11-18-pre-deploy-hardening.md)이 끝나면 켠다.
# 저장소 비밀값: STAGING_SSH_HOST·STAGING_SSH_KEY·STAGING_SSH_KNOWN_HOSTS·PROD_SSH_HOST·PROD_SSH_KEY·PROD_SSH_KNOWN_HOSTS
# 저장소 변수: DEPLOY_ENABLED·STAGING_BASE_URL·PROD_BASE_URL (예: https://api-staging.byeolmyeong.com)
# VM 의 .env·backup.env 는 올리지도 덮어쓰지도 않는다. 비밀값은 VM 에만 있다.
# 되돌리기는 jar 만 되돌린다. 새 jar 가 적용한 DB 마이그레이션은 남는다(운영은 배포 직전 백업으로 돌아갈 수 있다).
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: 올릴 곳
        type: choice
        options: [staging, prod]
        required: true
      ref:
        description: 올릴 태그·브랜치·커밋
        type: string
        required: true

permissions:
  contents: read

jobs:
  resolve:
    # 배포 스위치가 꺼져 있거나, PR 의 ci 나 실패한 ci 면 배포하지 않는다(건너뜀으로 표시).
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          case "$EVENT" in
            workflow_run) target=staging; ref="$RUN_SHA" ;;
            push) target=prod; ref="$GITHUB_SHA" ;;
            workflow_dispatch) target="$INPUT_TARGET"; ref="$INPUT_REF" ;;
            *) echo "모르는 이벤트: $EVENT" >&2; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "올릴 곳: $target · ref: $ref" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 같은 곳에 두 배포가 겹치지 않게 한다. 진행 중인 배포는 끊지 않고 다음 것이 기다린다.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 (운영은 테스트까지)
        run: |
          if [ "$TARGET" = prod ]; then ./gradlew build; else ./gradlew bootJar; fi
          test -f build/libs/app.jar

      - name: 접속 준비
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          # 대상의 값만 고른다. 하나라도 비면 다른 곳의 값으로 넘어가지 않고 멈춘다.
          if [ "$TARGET" = prod ]; then
            host="$PROD_SSH_HOST"; key="$PROD_SSH_KEY"; known="$PROD_SSH_KNOWN_HOSTS"; base="$PROD_BASE_URL"
          else
            host="$STAGING_SSH_HOST"; key="$STAGING_SSH_KEY"; known="$STAGING_SSH_KNOWN_HOSTS"; base="$STAGING_BASE_URL"
          fi
          if [ -z "$host" ] || [ -z "$key" ] || [ -z "$known" ] || [ -z "$base" ]; then
            echo "$TARGET 의 비밀값·변수가 비어 있다(docs/deploy.md 의 GitHub 등록 절)." >&2; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$known" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          {
            echo "DEPLOY_HOST=$host"
            echo "BASE_URL=$base"
            echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20"
          } >> "$GITHUB_ENV"

      - name: 파일 올리기
        id: upload
        run: |
          # shellcheck disable=SC2086 # SSH_OPTS 는 일부러 낱말로 나눈다.
          scp $SSH_OPTS -r deploy/compose.yaml deploy/Caddyfile deploy/backup.sh deploy/restore.sh deploy/initdb "ubuntu@$DEPLOY_HOST:/opt/byeolmyeong/"
          # shellcheck disable=SC2086
          scp $SSH_OPTS build/libs/app.jar "ubuntu@$DEPLOY_HOST:/opt/byeolmyeong/app.jar.new"

      - name: 바꿔 띄우기
        id: swap
        run: |
          # TARGET 은 resolve 가 정한 staging·prod 둘 중 하나라 이쪽에서 펼쳐 넘겨도 된다.
          # shellcheck disable=SC2086,SC2029
          ssh $SSH_OPTS "ubuntu@$DEPLOY_HOST" "TARGET=$TARGET bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/byeolmyeong
          [ -f .env ] || { echo ".env 가 없다(docs/deploy.md)." >&2; exit 1; }
          chmod +x backup.sh restore.sh initdb/*.sh
          # 운영: 바꾸기 전에 DB 를 백업한다. 되돌리기는 jar 만 되돌리므로 마이그레이션 이전으로 돌아갈 곳을 남긴다. 실패하면 배포하지 않는다.
          if [ "$TARGET" = prod ] && [ -n "$(docker compose ps -q postgres)" ]; then ./backup.sh; fi
          mv -f app.jar.new app.jar
          # 메이저 태그(postgres:17·eclipse-temurin:21-jre·caddy:2)의 새 패치를 받는다.
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          # jar 파일이 바뀌었으니 서버 컨테이너는 늘 새로 만든다(파일 하나를 붙이면 만들 때의 파일을 계속 본다).
          docker compose up -d --force-recreate --no-deps api
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          EOF

      - name: 살아났는지 확인 (아니면 마지막 정상 jar 로 되돌린다)
        # 파일을 올렸으면 앞 단계가 실패해도 늘 돈다. VM 이 확인 안 된 jar 로 남지 않게 한다.
        if: always() && steps.upload.outcome == 'success'
        env:
          SWAP_OUTCOME: ${{ steps.swap.outcome }}
        run: |
          healthy() {
            for _ in $(seq 1 36); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$BASE_URL/health" || true)"
              [ "$code" = 200 ] && return 0
              sleep 5
            done
            return 1
          }
          if [ "$SWAP_OUTCOME" = success ] && healthy; then
            # 이 jar 를 "마지막 정상 jar" 로 남긴다. 다음 배포가 실패하면 여기로 돌아온다.
            # shellcheck disable=SC2086
            ssh $SSH_OPTS "ubuntu@$DEPLOY_HOST" 'cp -f /opt/byeolmyeong/app.jar /opt/byeolmyeong/app.jar.good'
            echo "$TARGET: /health 200, 마지막 정상 jar 로 기록" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "바꿔 띄우기가 실패했거나 3분 안에 뜨지 않아 마지막 정상 jar 로 되돌린다." >&2
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "ubuntu@$DEPLOY_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/byeolmyeong
          [ -f app.jar.good ] || { echo "마지막 정상 jar 가 없다(첫 배포)." >&2; exit 1; }
          cp -f app.jar.good app.jar
          docker compose up -d --force-recreate --no-deps api
          EOF
          if healthy; then
            echo "$TARGET: 배포 실패, 마지막 정상 jar 로 되돌림(/health 200)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$TARGET: 배포 실패, 되돌린 뒤에도 /health 가 200 이 아니다" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
