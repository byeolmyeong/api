# 배포(결정 020 · 046). 절차·되돌리기는 docs/deploy.md.
# - develop 에 합쳐지고 ci 가 통과하면 → 스테이징(그 커밋)
# - main 에 합쳐지고 ci 가 통과하면 → 운영(그 커밋, 바꾸기 전에 DB 백업). main 에 합치는 것이 "사람의 확인"이다
# - 수동 실행(대상·ref) → 되돌리기나 다시 올리기(ci 를 거치지 않은 ref 일 수 있어 빌드·테스트를 다시 돌린다)
# 바꿔 띄우기는 끊김 없다(블루 · 그린, 결정 046): VM 의 swap.sh 가 쉬는 색에 새 jar 를 띄워 살아난 뒤에만 받는 쪽을 바꾼다.
# Postgres · Caddy 이미지는 받지도 다시 만들지도 않는다(따로 점검 모드로 한다).
# 저장소 변수 DEPLOY_ENABLED 가 true 일 때만 돈다. "배포 전 확인" 계획(docs/plans/2026-11-19-pre-deploy-hardening.md)이 끝나면 켠다.
# workflow_run 이라 저장소 기본 브랜치에 있는 이 파일로 돈다(docs/deploy.md 10번).
# 저장소 비밀값: STAGING_SSH_HOST·STAGING_SSH_KEY·STAGING_SSH_KNOWN_HOSTS·PROD_SSH_HOST·PROD_SSH_KEY·PROD_SSH_KNOWN_HOSTS
# 저장소 변수: DEPLOY_ENABLED·STAGING_BASE_URL·PROD_BASE_URL (예: https://api-staging.byeolmyeong.com)
# VM 의 .env·backup.env 는 올리지도 덮어쓰지도 않는다. 비밀값은 VM 에만 있다.
# 되돌리기는 jar 만 되돌린다(수동 실행으로 이전 커밋, 또는 VM 에서 ./swap.sh app.jar.good). 새 jar 가 적용한 DB 마이그레이션은 남는다(운영은 배포 직전 백업으로 돌아갈 수 있다).
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      target:
        description: 올릴 곳
        type: choice
        options: [staging, prod]
        required: true
      ref:
        description: 올릴 태그·브랜치·커밋
        type: string
        required: true

permissions:
  contents: read

jobs:
  resolve:
    # 배포 스위치가 꺼져 있거나, PR 의 ci 나 실패한 ci 면 배포하지 않는다(건너뜀으로 표시).
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
      ref: ${{ steps.pick.outputs.ref }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT:$RUN_BRANCH" in
            workflow_run:develop) target=staging; ref="$RUN_SHA" ;;
            workflow_run:main) target=prod; ref="$RUN_SHA" ;;
            workflow_dispatch:*) target="$INPUT_TARGET"; ref="$INPUT_REF" ;;
            *) echo "배포하지 않는 이벤트·브랜치: $EVENT $RUN_BRANCH" >&2; exit 1 ;;
          esac
          skip=false
          # 지난 ci 를 다시 돌려도 옛 커밋이 올라가지 않게, 브랜치의 지금 끝 커밋일 때만 배포한다(수동 실행은 고른 ref 그대로).
          if [ "$EVENT" = workflow_run ]; then
            tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_BRANCH" --jq .sha)"
            if [ "$tip" != "$RUN_SHA" ]; then
              skip=true
              echo "$RUN_BRANCH 에 더 새 커밋이 있어 건너뛴다(그 커밋의 ci 가 배포한다)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "target=$target"
            echo "ref=$ref"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"
          echo "올릴 곳: $target · ref: $ref" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 같은 곳에 두 배포가 겹치지 않게 한다. 진행 중인 배포는 끊지 않고 다음 것이 기다린다.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.resolve.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드 (수동 실행은 테스트까지)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # ci 를 통과한 커밋이면 jar 만 만든다. 수동 실행은 ci 를 거치지 않은 ref 일 수 있어 테스트까지 돌린다.
          if [ "$EVENT" = workflow_dispatch ]; then ./gradlew build; else ./gradlew bootJar; fi
          test -f build/libs/app.jar

      - name: 접속 준비
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          # 대상의 값만 고른다. 하나라도 비면 다른 곳의 값으로 넘어가지 않고 멈춘다.
          if [ "$TARGET" = prod ]; then
            host="$PROD_SSH_HOST"; key="$PROD_SSH_KEY"; known="$PROD_SSH_KNOWN_HOSTS"; base="$PROD_BASE_URL"
          else
            host="$STAGING_SSH_HOST"; key="$STAGING_SSH_KEY"; known="$STAGING_SSH_KNOWN_HOSTS"; base="$STAGING_BASE_URL"
          fi
          if [ -z "$host" ] || [ -z "$key" ] || [ -z "$known" ] || [ -z "$base" ]; then
            echo "$TARGET 의 비밀값·변수가 비어 있다(docs/deploy.md 의 GitHub 등록 절)." >&2; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$known" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          {
            echo "DEPLOY_HOST=$host"
            echo "BASE_URL=$base"
            echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20"
          } >> "$GITHUB_ENV"

      - name: VM 확인 (블루 · 그린으로 옮긴 VM 인지)
        run: |
          # 옮겨 가지 않은 VM(active_color 가 없음)에는 아무것도 올리지 않는다. 처음 옮겨 가기는 점검 모드를 켜고 손으로 한다(결정 046 의 9).
          # shellcheck disable=SC2086
          if ! ssh $SSH_OPTS "ubuntu@$DEPLOY_HOST" 'test -f /opt/byeolmyeong/active_color && test -f /opt/byeolmyeong/upstream.caddy'; then
            echo "$TARGET: 블루 · 그린으로 옮기지 않은 VM 이다. docs/deploy.md 의 '블루 · 그린으로 처음 옮겨 가기' 를 먼저 한다. 아무것도 바꾸지 않았다." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi

      - name: 파일 올리기
        run: |
          # 결정 046 앞의 커밋(swap.sh 가 없음)을 올릴 때는 jar 만 올린다. 그 커밋의 compose.yaml · Caddyfile 은 블루 · 그린 VM 을 깬다.
          if [ -f deploy/swap.sh ]; then
            # shellcheck disable=SC2086 # SSH_OPTS 는 일부러 낱말로 나눈다.
            scp $SSH_OPTS -r deploy/compose.yaml deploy/Caddyfile deploy/swap.sh deploy/backup.sh deploy/restore.sh deploy/initdb "ubuntu@$DEPLOY_HOST:/opt/byeolmyeong/"
          else
            echo "$TARGET: 결정 046 앞의 커밋이라 설정 파일은 올리지 않고 jar 만 바꾼다." >> "$GITHUB_STEP_SUMMARY"
          fi
          # shellcheck disable=SC2086
          scp $SSH_OPTS build/libs/app.jar "ubuntu@$DEPLOY_HOST:/opt/byeolmyeong/app.jar.new"

      - name: 바꿔 띄우기 (끊김 없이)
        run: |
          # tee 뒤에서도 ssh 의 실패로 이 단계가 실패하게 한다(기본 셸은 pipefail 이 꺼져 있다).
          set -o pipefail
          # TARGET 은 resolve 가 정한 staging·prod 둘 중 하나라 이쪽에서 펼쳐 넘겨도 된다.
          # shellcheck disable=SC2086,SC2029
          ssh $SSH_OPTS "ubuntu@$DEPLOY_HOST" "TARGET=$TARGET bash -s" <<'EOF' | tee swap.log
          set -euo pipefail
          cd /opt/byeolmyeong
          [ -f .env ] || { echo ".env 가 없다(docs/deploy.md)." >&2; exit 1; }
          chmod +x swap.sh backup.sh restore.sh initdb/*.sh
          # 운영: jar 를 바꾸기 전에 DB 를 백업한다. 되돌리기는 jar 만 되돌리므로 마이그레이션 이전으로 돌아갈 곳을 남긴다. 실패하면 배포하지 않는다.
          # Postgres 는 띄우거나 다시 만들지 않는다(결정 046 의 6) — 떠 있지 않으면 멈춘다.
          if [ "$TARGET" = prod ]; then
            docker compose ps --status running --services | grep -qx postgres || { echo "Postgres 가 떠 있지 않다(docker compose ps)." >&2; exit 1; }
            ./backup.sh predeploy
          fi
          # 쉬는 색에 새 jar 를 띄워 /health 200 을 본 뒤에만 받는 쪽을 바꾸고, 옛 색은 하던 일을 끝낸 뒤 내린다.
          # 새 색이 살아나지 않으면 받는 쪽은 옛 색 그대로다(되돌릴 것이 없다).
          ./swap.sh app.jar.new
          EOF
          grep -E 'event=swap_(switched|old_stopped|done)' swap.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: 밖에서 확인
        run: |
          # swap.sh 는 Caddy 안에서 /health 를 보고 바꿨다. 여기서는 밖의 주소(인증서 · DNS 까지)로 한 번 더 본다.
          for _ in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$BASE_URL/health" || true)"
            if [ "$code" = 200 ]; then
              echo "$TARGET: 끊김 없이 바꿈, 밖에서 /health 200" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "$TARGET: 서버는 바꿨지만 밖에서 /health 가 200 이 아니다(Caddy · 인증서 · DNS 를 본다, docs/deploy.md)" | tee -a "$GITHUB_STEP_SUMMARY" >&2
          exit 1
