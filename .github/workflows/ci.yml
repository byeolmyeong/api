# 올릴 때마다 빌드와 테스트를 돌린다. 테스트는 Testcontainers 가 Docker 로 PostgreSQL 을 띄운다(러너에 Docker 가 있다).
name: ci

on:
  pull_request:
  push:
    # develop 은 스테이징, main 은 운영으로 배포된다(결정 020). 배포는 이 워크플로가 통과한 커밋만 한다(deploy.yml).
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 빌드와 테스트
        run: ./gradlew build
      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
